<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面不存在 · Demo 作品集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A1D21'/%3E%3Cpath d='M17.5 5 9 18h5.5L13 27l10-14h-6l1.5-8z' fill='%23FAF8F4'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #FAF8F4; --ink: #1A1D21; --ink-2: #55595F; --ink-3: #8A8F96;
    --line: #E3DFD7; --accent: #B3452E;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Courier New", monospace;
    --serif: Georgia, "Songti SC", "STSong", "SimSun", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; display: grid; place-items: center; padding: 24px; line-height: 1.8; }
  .box { text-align: center; max-width: 520px; }
  .num { font-family: var(--serif); font-size: clamp(96px, 22vw, 150px); line-height: 1; position: relative; display: inline-block; }
  .num::after { content: ""; position: absolute; left: 4%; right: 4%; top: 54%; height: 5px; background: var(--accent); transform: rotate(-2deg); }
  h1 { font-size: 21px; margin: 30px 0 10px; }
  p { color: var(--ink-2); font-size: 14.5px; margin-bottom: 28px; }
  .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .acts a { font-family: var(--mono); font-size: 13px; letter-spacing: .04em; text-decoration: none; padding: 11px 22px; border-radius: 6px; }
  .btn-ink { background: var(--ink); color: var(--bg); }
  .btn-line { border: 1px solid var(--line); color: var(--ink); }
  .btn-line:hover { border-color: var(--accent); color: var(--accent); }
  .path { margin-top: 30px; font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); word-break: break-all; }
</style>
</head>
<body>
<main class="box">
  <div class="num">404</div>
  <h1>这个页面不存在。</h1>
  <p>链接可能打错了。回作品集首页，五个 demo 都能重新打开。</p>
  <div class="acts">
    <a class="btn-ink" href="index.html">回作品集</a>
    <a class="btn-line" href="autodemo/demo1.html">看工作流 demo</a>
  </div>
  <div class="path">请求路径：<span id="p"></span></div>
</main>
<script>document.getElementById('p').textContent = location.pathname + location.search;</script>
</body>
</html>
